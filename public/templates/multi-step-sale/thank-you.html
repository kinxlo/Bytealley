<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- <link rel="stylesheet" href="/thankyou.css" /> -->
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap");
      @import url("https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap");

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        list-style-type: none;
      }
      :root {
        --primary-color: #001d0f;
        --secondary-color: #00ee7e;
        --white-text: #e6e6e6;
        --faded-white-bg: #f7fbf9cc;
        --faded-white-bg-ii: #f7fbf9cc;
        --off-white: #ffffffb2;
        --faded-green-bg: #eaefff1f;
        --gray: #595959;
        --gray-ii: #f8f8f8;
        --white: #ffffff;
        --green: #00ee7e;
      }

      a {
        text-decoration: none;
        color: var(--primary-color);
        transition: color 0.3s;
      }
      a:hover {
        color: var(--secondary-color);
      }

      body {
        background-color: var(--white);
        font-family: "Inter", serif;
      }

      button {
        background-color: var(--secondary-color);
        color: var(--primary-color);
        border-radius: 0.7rem;
        padding: 0.9rem;
        border: 0;
        font-weight: 700;
        font-size: medium;
        width: 100%;
        max-width: 250px;
        margin: auto;
      }
      button:hover {
        background-color: var(--faded-white-bg);
      }

      .nav-bar {
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        padding: 2rem 0rem;
        text-align: center;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .heading-txt {
        font-size: 2rem;
        text-align: center;
      }

      .spt-res-w {
        width: 90%;
        margin: auto;
        max-width: 1440px;
      }
      .thank-you-section {
        padding: 6rem 0rem;
      }
      .thank-you-container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 2rem;
        text-align: center;
        padding: 2rem 0rem;
        width: 100%;
        max-width: 700px;
        margin: auto;
      }
      .thank-u-text {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .footer-container {
        display: grid;
        grid-template-columns: 1fr;
        gap: 3rem;
        align-items: center;
        text-align: center;
        padding: 2rem 0rem;
      }
      .spt-logo {
        color: var(--text-color);
        text-align: center;
      }

      .links {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        justify-content: center;
      }
      .links li a {
        color: var(--text-color);
      }
      .links li a:hover {
        color: var(--secondary-color);
      }

      footer {
        background-color: var(--faded-blue);
        color: var(--text-color);
      }

      @media (width > 768px) {
        .footer-frag-three {
          display: flex;
          justify-content: end;
        }

        .footer-container {
          grid-template-columns: 1fr 1fr 1fr;
        }
        .footer-container h1 {
          text-align: left;
        }
        .links {
          flex-direction: row;
          gap: 0.5rem;
        }
      }

      @media (width > 900px) {
        a {
          color: var(--white-text);
        }
        h1 {
          font-size: 2rem;
          font-weight: bold;
        }
        .heading-txt {
          font-size: 2.8rem;
        }

        .spt-logo {
          text-align: left;
        }

        .links {
          gap: 1.5rem;
        }
      }

      @media (width > 1440px) {
        h1 {
          font-size: 3rem;
        }

        .spt-res-w {
          width: 85%;
        }
      }
    </style>
  </head>
  <body>
    <section>
      <nav class="nav-bar">
        <h2>LOGO</h2>
      </nav>
    </section>

    <section class="thank-you-section">
      <div class="thank-you-container">
        <img
          src="https://res.cloudinary.com/doejcrfso/image/upload/v1751894362/bytealley%20funnel/Success_Icon_xgpfk9.svg"
          alt="success icon"
        />
        <div class="thank-u-text">
          <h2>Thank You For Your Purchase</h2>
          <p>
            Your Order is Complete! Click below to download the full course and
            start your transformation journey:
          </p>
        </div>
        <button>Get started Here</button>
      </div>
    </section>

    <footer>
      <div class="footer-container spt-res-w">
        <h2 class="spt-logo">LOGO</h2>

        <div class="footer-frag-two">
          <ul class="links">
            <li><a href="#">Nav Item</a></li>
            <li><a href="#">Nav Item</a></li>
            <li><a href="#">Nav Item</a></li>
          </ul>
        </div>
        <div class="footer-frag-three">
          <ul class="links">
            <li><a href="#">Nav Item</a></li>
          </ul>
        </div>
      </div>
    </footer>

    <script src="/app.js"></script>
  </body>
</html>
