<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thank You</title>
    <style>
      :root {
        --gjs-t-color-primary: #38514e !important;
        --gjs-t-color-secondary: #ebe4d4 !important;
        --gjs-t-color-white: #e6e6e6 !important;
        --gjs-t-color-off-white: #fcfbf8 !important;
        --gjs-t-color-light-green: #536d6a !important;
        --gjs-t-color-cream: #ebe4d4 !important;
        --gjs-t-color-cream-ii: #fcfbf8 !important;
        --gjs-t-color-accent: #ffb347 !important;
        --gjs-t-color-success: #28a745 !important;
        --gjs-t-color-warning: #ffc107 !important;
        --gjs-t-color-error: #dc3545 !important;
      }

      .gjs-t-body {
        background-color: inherit !important;
        color: inherit !important;
        font-size: 1rem !important;
        line-height: 1.75rem !important;
        font-family: "Inter", sans-serif !important;
      }

      .gjs-t-link {
        color: var(--gjs-t-color-primary) !important;
        text-decoration: none !important;
        transition: color 0.3s !important;
      }

      .gjs-t-link:hover {
        color: var(--gjs-t-color-secondary) !important;
      }

      .gjs-t-button {
        background-color: var(--gjs-t-color-primary) !important;
        color: white !important;
        border-radius: 0.7rem !important;
        padding: 0.9rem !important;
        border: 0 !important;
        font-weight: 700 !important;
        font-size: medium !important;
        width: 100% !important;
        max-width: 250px !important;
        cursor: pointer !important;
      }

      .gjs-t-button:hover {
        background-color: var(--gjs-t-color-secondary) !important;
        color: black !important;
        border: 1px solid var(--gjs-t-color-primary) !important;
      }

      .gjs-t-h1 {
        font-size: 2rem !important;
        font-weight: bold !important;
        text-align: center !important;
        color: var(--gjs-t-color-primary) !important;
      }

      .gjs-t-h2 {
        font-size: 1.5rem !important;
        line-height: 2rem !important;
        color: var(--gjs-t-color-primary) !important;
      }

      .gjs-t-list {
        list-style-type: none !important;
      }

      .gjs-container {
        width: 90% !important;
        margin: auto !important;
        max-width: 1440px !important;
      }

      .gjs-nav-bar {
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1) !important;
        padding: 2rem 0 !important;
        text-align: center !important;
        display: flex !important;
        justify-content: center !important;
        align-items: center !important;
      }

      .gjs-section-thank-you {
        padding: 4rem 0 !important;
      }

      .gjs-thank-you-container {
        display: flex !important;
        flex-direction: column !important;
        justify-content: center !important;
        align-items: center !important;
        gap: 2rem !important;
        text-align: center !important;
        padding: 2rem 0 !important;
        width: 100% !important;
        max-width: 700px !important;
        margin: auto !important;
      }

      .gjs-thank-you-text {
        display: flex !important;
        flex-direction: column !important;
        gap: 1rem !important;
      }

      .gjs-section-accordion {
        padding: 4rem 0 !important;
      }

      .gjs-accordion-container {
        display: flex !important;
        flex-direction: column !important;
        gap: 2rem !important;
      }

      .gjs-accordion {
        background-color: var(--gjs-t-color-cream-ii) !important;
        padding: 1rem !important;
        border-radius: 1rem !important;
      }

      .gjs-accordion-img {
        width: 24px !important;
        height: 24px !important;
      }

      .gjs-accordion-img img {
        width: 100% !important;
        height: 100% !important;
        object-fit: contain !important;
      }

      .gjs-success-icon {
        width: 80px !important;
        height: 80px !important;
      }

      .gjs-success-icon img {
        width: 100% !important;
        height: 100% !important;
        object-fit: contain !important;
      }

      .gjs-accordion-checks {
        display: flex !important;
        gap: 0.8rem !important;
        align-items: center !important;
      }

      .gjs-accordion-question {
        display: flex !important;
        justify-content: space-between !important;
        align-items: center !important;
        padding: 0.5rem !important;
      }

      .gjs-accordion-para {
        display: none !important;
        padding: 1rem !important;
      }

      .gjs-accordion-para.active {
        display: block !important;
        transition: 0.3s ease-in-out !important;
      }

      .gjs-accordion-plus.hideplus {
        display: none !important;
        transition: 0.3s ease-in-out !important;
      }

      .gjs-accordion-minus {
        display: none !important;
      }

      .gjs-accordion-minus.showminus {
        display: block !important;
        rotate: 90deg !important;
        transition: 0.3s ease-in-out !important;
      }

      .gjs-logo {
        color: var(--gjs-t-color-primary) !important;
        text-align: center !important;
      }

      .gjs-links {
        display: flex !important;
        flex-direction: column !important;
        gap: 1rem !important;
        justify-content: center !important;
      }

      .gjs-links li a {
        color: var(--gjs-t-color-primary) !important;
      }

      .gjs-links li a:hover {
        color: var(--gjs-t-color-secondary) !important;
      }

      .gjs-text-wrapper {
        width: 100% !important;
      }

      .gjs-text-content {
        width: 100% !important;
      }

      @media (width > 768px) {
        .gjs-links {
          flex-direction: row !important;
          gap: 0.5rem !important;
        }
      }

      @media (width > 900px) {
        .gjs-t-link {
          color: var(--gjs-t-color-white) !important;
        }

        .gjs-t-h1 {
          font-size: 2rem !important;
        }

        .gjs-t-h2 {
          font-size: 2.8rem !important;
        }

        .gjs-logo {
          text-align: left !important;
        }

        .gjs-links {
          gap: 1.5rem !important;
        }

        .gjs-success-icon {
          width: 100px !important;
          height: 100px !important;
        }
      }

      @media (width > 1440px) {
        .gjs-t-h1 {
          font-size: 3rem !important;
        }

        .gjs-container {
          width: 85% !important;
        }
      }
    </style>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="gjs-t-body">
    <section class="gjs-nav-section">
      <nav class="gjs-nav-bar">
        <div class="gjs-logo-wrapper">
          <h2 class="gjs-logo">LOGO</h2>
        </div>
      </nav>
    </section>

    <section class="gjs-section-thank-you">
      <div class="gjs-thank-you-container gjs-container">
        <div class="gjs-success-icon">
          <img
            src="https://res.cloudinary.com/doejcrfso/image/upload/v1751894362/bytealley%20funnel/Success_Icon_xgpfk9.svg"
            alt="success icon"
          />
        </div>
        <div class="gjs-thank-you-text">
          <div class="gjs-text-wrapper">
            <h2 class="gjs-t-h2">Thank You For Your Purchase</h2>
          </div>
          <div class="gjs-text-content">
            <p style="text-align: center">We've received your payment successfully. Your package is on its way</p>
          </div>
        </div>
      </div>
    </section>

    <section class="gjs-section-accordion">
      <div class="gjs-accordion-container gjs-container">
        <div class="gjs-accordion">
          <div class="gjs-accordion-question">
            <div class="gjs-accordion-checks">
              <div class="gjs-accordion-img">
                <img
                  src="https://res.cloudinary.com/doejcrfso/image/upload/v1752156552/bytealley%20funnel/checkbox_c8psr0.svg"
                  alt="checkbox-icon"
                />
              </div>
              <div class="gjs-text-wrapper">
                <h2 class="gjs-t-h2">Check Your Email</h2>
              </div>
            </div>
            <div class="gjs-accordion-img">
              <img
                src="https://res.cloudinary.com/doejcrfso/image/upload/v1751895241/bytealley%20funnel/arrow_fpadwn.svg"
                alt=""
                class="gjs-accordion-plus"
              />
              <img
                src="https://res.cloudinary.com/doejcrfso/image/upload/v1751895241/bytealley%20funnel/arrow_fpadwn.svg"
                alt=""
                class="gjs-accordion-minus"
              />
            </div>
          </div>

          <div class="gjs-accordion-para">
            <div class="gjs-text-content">
              <p>An email has been sent to your@email.com to access your freebie product</p>
            </div>
          </div>
        </div>

        <div class="gjs-accordion">
          <div class="gjs-accordion-question">
            <div class="gjs-accordion-checks">
              <div class="gjs-accordion-img">
                <img
                  src="https://res.cloudinary.com/doejcrfso/image/upload/v1752156552/bytealley%20funnel/checkbox_c8psr0.svg"
                  alt="checkbox-icon"
                />
              </div>
              <div class="gjs-text-wrapper">
                <h2 class="gjs-t-h2">Download Your Product</h2>
              </div>
            </div>
            <div class="gjs-button-wrapper">
              <button class="gjs-t-button">ACCESS PRODUCT</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script>
      const plusButtons = document.querySelectorAll(".gjs-accordion-plus");
      const minusButtons = document.querySelectorAll(".gjs-accordion-minus");
      const paragraphs = document.querySelectorAll(".gjs-accordion-para");

      function setupToggle(index) {
        plusButtons[index].addEventListener("click", () => {
          // Hide all other active FAQs first
          plusButtons.forEach((btn, i) => {
            if (i !== index) {
              btn.classList.remove("hideplus");
              minusButtons[i].classList.remove("showminus");
              paragraphs[i].classList.remove("active");
            }
          });

          // Show clicked FAQ
          plusButtons[index].classList.add("hideplus");
          minusButtons[index].classList.add("showminus");
          paragraphs[index].classList.add("active");
        });

        minusButtons[index].addEventListener("click", () => {
          minusButtons[index].classList.remove("showminus");
          paragraphs[index].classList.remove("active");
          plusButtons[index].classList.remove("hideplus");
        });
      }

      // Set up event listeners for all elements
      plusButtons.forEach((_, index) => setupToggle(index));
    </script>
  </body>
</html>
